[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "site-guardian"
version = "0.1.0"
description = "Passive security auditor for small business websites"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["security", "ssl", "dns", "spf", "dkim", "audit", "cli"]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "dnspython>=2.4.0",
    "requests>=2.31.0",
]

[project.scripts]
site-guardian = "site_guardian.cli:app"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/site-guardian"
Issues = "https://github.com/YOUR_USERNAME/site-guardian/issues"

[tool.setuptools.packages.find]
where = ["src"]
